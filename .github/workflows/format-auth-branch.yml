name: One-time Go format for SVM users branch

on:
  push:
    branches:
      - codex/multi-user-email-auth-20261104

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/codex/multi-user-email-auth-20261104'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply Go formatting
        run: |
          gofmt -w internal/site/app.go internal/site/security.go internal/site/users.go internal/site/users_test.go
      - name: Commit formatting, if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/site/app.go internal/site/security.go internal/site/users.go internal/site/users_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt multi-user authentication"
            git push origin HEAD:codex/multi-user-email-auth-20261104
          fi
