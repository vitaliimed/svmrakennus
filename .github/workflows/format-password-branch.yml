name: Format password flexibility test

on:
  push:
    branches:
      - codex/flexible-admin-passwords-20261104

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format new regression test
        run: gofmt -w internal/site/password_flex_test.go
      - name: Push formatting if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/site/password_flex_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style: gofmt flexible password test"
            git push origin HEAD:codex/flexible-admin-passwords-20261104
          fi
